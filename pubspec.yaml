name: flutter_reality
description: A cross-platform Flutter plugin for building augmented reality experiences with native ARCore support on Android and ARKit support on iOS.
version: 0.1.0
repository: https://github.com/Jardineo-EIP-EpitechNIce/flutter_reality
topics:
  - augmented-reality
  - arcore
  - arkit
  - ar

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.3
  vector_math: ^2.1.1
  json_annotation: ^4.12.0
  geolocator: ^14.0.3
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.flutterreality.flutter_reality
        pluginClass: ArFlutterPlugin
      ios:
        pluginClass: ArFlutterPlugin
