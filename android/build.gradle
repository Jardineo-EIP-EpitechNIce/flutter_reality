group 'com.flutterreality.flutter_reality'
version '1.0-SNAPSHOT'

buildscript {
    // arsceneview 4.x requires Kotlin 2.4.10+ and its matching Compose
    // compiler plugin (see android/build.gradle upgrade notes below).
    ext.kotlin_version = '2.4.10'
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        // Compose foundation/ui 1.12.1 (pulled in by arsceneview 4.x) requires
        // AGP 9.1.0+ and compileSdk 37.
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk 37
    namespace 'com.flutterreality.flutter_reality'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 36
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // arsceneview 4.x is a ground-up rewrite onto Jetpack Compose (verified via
    // Maven Central's published POM and decompiled sources - see
    // agents/sceneview-4x-upgrade's plan for the full rationale). It is
    // embedded here via a ComposeView inside this plugin's PlatformView.
    implementation 'io.github.sceneview:arsceneview:4.38.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}